<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Feedback</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f0ebf8;color:#202124}
.w{max-width:560px;margin:0 auto;padding:16px}.c{background:#fff;border-radius:10px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h1{margin:0 0 4px;font-size:1.5rem}#t{position:sticky;top:0;z-index:2;background:#673ab7;color:#fff;text-align:center;padding:10px;font-size:1.3rem;font-weight:700}
#t.low{background:#d93025}label.q{display:block;font-weight:600;margin-bottom:8px}textarea,input[type=text],input[type=email]{width:100%;padding:10px;font-size:1rem;border:1px solid #ccc;border-radius:6px}
textarea{min-height:90px}.r label{display:block;padding:6px 0}button{width:100%;padding:14px;font-size:1.1rem;background:#673ab7;color:#fff;border:0;border-radius:8px}
button:disabled{background:#999}#msg{display:none;text-align:center;font-size:1.3rem;font-weight:700}.req{color:#d93025}fieldset{border:0;padding:0;margin:0}fieldset:disabled{opacity:.5}
</style></head><body><div id="t">2:00</div><div class="w">
<div class="c"><h1>Customer Feedback</h1><div>Please submit within 2 minutes of tapping.</div></div>
<div class="c" id="msg"></div>
<form id="f"><fieldset id="fs">
<div class="c r"><label class="q">Feedback Type</label>
<label><input type="radio" name="entry.1591633300" value="Comments"> Comments</label>
<label><input type="radio" name="entry.1591633300" value="Questions"> Questions</label>
<label><input type="radio" name="entry.1591633300" value="Bug Reports"> Bug Reports</label>
<label><input type="radio" name="entry.1591633300" value="Feature Request"> Feature Request</label></div>
<div class="c"><label class="q">Feedback <span class="req">*</span></label><textarea name="entry.326955045" required></textarea></div>
<div class="c"><label class="q">Suggestions for improvement</label><textarea name="entry.1696159737"></textarea></div>
<div class="c"><label class="q">Name</label><input type="text" name="entry.485428648"></div>
<div class="c"><label class="q">Email</label><input type="email" name="entry.879531967"></div>
<button id="b" type="submit">Submit</button></fieldset></form></div>
<script>
const URL_='https://docs.google.com/forms/d/e/1FAIpQLSdxfaYxcah0Gn_wn_UVKtwu-Dj6rN1MdqmprL7BOcROOMwOSg/formResponse';
const D=120000,K='nfcFormStart',now=Date.now();let s=+localStorage.getItem(K)||0;
const q=new URLSearchParams(location.search);
// ?tap = fresh NFC tap: always start new session, then strip param so reload resumes
if(q.has('tap')||!s){s=now;localStorage.setItem(K,s);localStorage.removeItem('nfcDone')}
if(q.has('tap')){q.delete('tap');const qs=q.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash)}
const t=document.getElementById('t'),fs=document.getElementById('fs'),m=document.getElementById('msg');let iv;
function show(x){m.textContent=x;m.style.display='block';window.scrollTo(0,0)}
function lock(x){clearInterval(iv);fs.disabled=true;show(x)}
function tick(){const l=Math.max(0,D-(Date.now()-s)),sec=Math.ceil(l/1000);t.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');t.classList.toggle('low',sec<=30);if(l<=0){t.textContent='0:00';lock("Time's up, tap the tag again")}}
if(localStorage.getItem('nfcDone')==s){lock('Thanks! Your feedback was submitted.');t.textContent='Done'}else{tick();iv=setInterval(tick,250)}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(Date.now()-s>=D){tick();return}
const b=document.getElementById('b');b.disabled=true;b.textContent='Sending...';
try{await fetch(URL_,{method:'POST',mode:'no-cors',body:new URLSearchParams(new FormData(e.target))});localStorage.setItem('nfcDone',s);lock('Thanks! Your feedback was submitted.');t.textContent='Done'}
catch(err){b.disabled=false;b.textContent='Submit';alert('Could not send, check your connection and try again.')}};
</script></body></html>
